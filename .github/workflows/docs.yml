# Builds the reference docs of every package the index lists, each version
# tag once, and publishes them on this repository's GitHub Pages
# (https://pepper-lang.dev/index/): scripts/build-docs.sh says how.
#
# Two jobs, so the token that can push never meets a package's files: `build`
# clones the packages with a read-only token and uploads the site; `publish`
# pushes it to gh-pages.
name: docs

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: ["packages/**", "scripts/build-docs.sh", ".github/workflows/docs.yml"]
  # A pull request builds the docs (to check the script) and publishes nothing.
  pull_request:
    paths: ["scripts/build-docs.sh", ".github/workflows/docs.yml"]
  workflow_dispatch:
    inputs:
      rebuild:
        description: Build every version again (after the renderer changes)
        type: boolean
        default: false

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 120
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The site as published, so each version builds once.
      - name: Fetch the published site
        run: |
          if git ls-remote --exit-code origin gh-pages; then
            git fetch --depth 1 origin gh-pages
            mkdir site
            git --work-tree=site checkout FETCH_HEAD -- .
          else
            mkdir site
          fi

      - name: Install mdBook
        env:
          MDBOOK_VERSION: v0.4.52
        run: |
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl --fail --location --silent --show-error --retry 3 \
            "https://github.com/rust-lang/mdBook/releases/download/$MDBOOK_VERSION/mdbook-$MDBOOK_VERSION-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      # The toolchain whose pep-doc renders the docs: one whose `doc
      # package` takes --docs-base (0.13.0 and later; the build of main
      # until 0.13.0 is released).
      - name: Install Pepper
        env:
          PEPPER_VERSION: 0.13.0-dev
        run: |
          # A file, not a pipe: a piped script cannot also read /dev/null,
          # which keeps it from asking; the site needs neither clang nor
          # OpenSSL.
          curl -fsSL -o "$RUNNER_TEMP/install.sh" https://raw.githubusercontent.com/pep-lang/pepper/main/scripts/install.sh
          sh "$RUNNER_TEMP/install.sh" --version "$PEPPER_VERSION" --no-modify-path --no-prerequisites < /dev/null
          echo "$HOME/.pepper/bin" >> "$GITHUB_PATH"

      - name: Build the docs
        env:
          REBUILD: ${{ inputs.rebuild && '--rebuild' || '' }}
        run: |
          pepper --version
          bash scripts/build-docs.sh site $REBUILD

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
          include-hidden-files: true
          retention-days: 1

  publish:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash -euxo pipefail {0}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - name: Push to gh-pages
        env:
          TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Package docs"
          git push --force "https://x-access-token:$TOKEN@github.com/$REPOSITORY.git" gh-pages
